{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'global/partials/_design_head.html' %}
    <link rel="stylesheet" href="{% static 'global/css/lista_campanhas_style.css' %}?d={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'global/css/fontes.css' %}?d={% now 'U' %}">
    <title>Estúdio de Imagem</title>
    <style>
        .st-wrap { max-width: 720px; margin: 0 auto; padding: 16px; color: #e8e8e8; }
        .st-wrap a.voltar { color: #c9a55c; font-size: 14px; }
        .st-field { display: block; margin: 10px 0; font-size: 14px; color: #c0c0cc; }
        .st-field select, .st-field input[type=text], .st-wrap textarea {
            width: 100%; background: #26262e; color: #e8e8e8; border: 1px solid #444;
            border-radius: 6px; padding: 8px; font-family: inherit; box-sizing: border-box; }
        .st-wrap textarea { resize: vertical; }
        .st-check { display: flex; align-items: center; gap: 6px; }
        .st-gen { width: 100%; background: #7a2ea0; color: #fff; border: none; border-radius: 6px;
            padding: 12px; cursor: pointer; font-size: 15px; font-weight: 700; margin-top: 8px; }
        .st-gen:hover { background: #9a3ec8; }
        .st-status { color: #c9a55c; font-size: 13px; min-height: 18px; margin: 8px 0; }
        .st-card { background: #24242c; border: 1px solid #383840; border-radius: 8px; padding: 10px; margin-top: 12px; }
        .st-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #444; }
        .st-badge.processing { background: #3a5a8a; } .st-badge.done { background: #2e7d46; }
        .st-badge.failed { background: #8a2e2e; }
        .st-prompt { font-size: 13px; margin: 6px 0; }
        .st-xprompt { font-size: 11px; color: #999; } .st-xprompt div { font-style: italic; margin-top: 3px; }
        .st-preview { width: 100%; border-radius: 6px; margin-top: 6px; cursor: zoom-in; }
        .st-actions { display: flex; gap: 6px; margin-top: 6px; }
        .st-actions button { flex: 1; padding: 8px; border: none; border-radius: 5px; cursor: pointer; background: #3a3a44; color: #eee; }
        .st-approve { background: #2e7d46 !important; }
        .st-err { color: #ff8a8a; font-size: 12px; }
        .st-jref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px,1fr)); gap: 6px;
            margin-top: 6px; max-height: 180px; overflow-y: auto; padding: 4px; border: 1px solid #444; border-radius: 6px; }
        .st-jref-grid[hidden] { display: none; }
        .st-jref-item { padding: 0; border: 2px solid transparent; border-radius: 5px; background: none; cursor: pointer; aspect-ratio: 1; overflow: hidden; }
        .st-jref-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .st-jref-item.is-sel { border-color: #c9a55c; }
    </style>
</head>

<body>
    <div class="st-wrap">
        <a class="voltar" href="{% url 'gurps:carregar_campanha_gm' %}">← voltar</a>
        <h1 class="titulo-pagina medievalsharp-regular" style="font-size:2rem;">🎨 Estúdio de Imagem — {{ campanha.nome }}</h1>

        <label class="st-field">Tipo:
            <select id="ig-kind" onchange="rd6IgKindChange()">
                <option value="personagem">Personagem (retrato)</option>
                <option value="cena">Cena / cenário</option>
                <option value="capa">Capa / título (com texto)</option>
                <option value="item">Item / objeto</option>
            </select>
        </label>
        <label class="st-field" id="ig-title-wrap" style="display:none;">Título do episódio (escrito por cima):
            <input type="text" id="ig-title" maxlength="200" placeholder="Ex.: Episódio 7: O Portão Sombrio">
        </label>
        <label class="st-field">Estilo:
            <select id="ig-style">
                <option value="cinematic_dark">Cinematográfico escuro (realista) — padrão</option>
                <option value="photoreal">Fotorrealista neutro</option>
                <option value="oil">Pintura a óleo sombria</option>
                <option value="gritty">Sujo / grimdark</option>
                <option value="anime">Anime</option>
                <option value="none">Sem estilo</option>
            </select>
        </label>
        <label class="st-field">Descreva (curto — a IA completa lendo o journal):
            <textarea id="ig-prompt" rows="3" placeholder="Ex.: 'o grupo diante do portão da cidade ao anoitecer'"></textarea>
        </label>
        <label class="st-field st-check"><input type="checkbox" id="ig-context" checked> Ler o journal (coerência com o mundo)</label>
        <div class="st-field">
            <button type="button" class="menu-button" onclick="rd6IgToggleJournalRef()" style="font-size:12px;">📖 Referência do journal</button>
            <span id="ig-jref-label" style="font-size:11px;color:#999;margin-left:6px;"></span>
            <div id="ig-jref-grid" class="st-jref-grid" hidden></div>
        </div>
        <label class="st-field" style="font-size:12px;">…ou enviar uma referência:
            <input type="file" id="ig-ref" accept="image/*">
        </label>
        <button type="button" class="st-gen" onclick="rd6IgSubmit()">Gerar imagem</button>
        <p class="st-status" id="ig-status"></p>
        <div id="ig-list"></div>
    </div>

    {% csrf_token %}
    <script>
        var RD6_IG_CAMP = {{ campanha.id }};
        var _igPoll = null, _igJournalRef = null;
        function rd6Csrf() { var e = document.querySelector('[name=csrfmiddlewaretoken]'); return e ? e.value : ''; }
        function rd6Esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
        function rd6IgKindChange() {
            document.getElementById('ig-title-wrap').style.display =
                (document.getElementById('ig-kind').value === 'capa') ? 'block' : 'none';
        }
        function rd6IgToggleJournalRef() {
            var grid = document.getElementById('ig-jref-grid');
            if (!grid.hidden) { grid.hidden = true; return; }
            grid.hidden = false; grid.innerHTML = '<span style="font-size:11px;opacity:.6">carregando…</span>';
            fetch('/imagegen/' + RD6_IG_CAMP + '/journal/').then(function (r) { return r.json(); }).then(function (d) {
                var items = (d && d.items) || [];
                if (!items.length) { grid.innerHTML = '<span style="font-size:11px;opacity:.6">Nenhuma imagem no journal.</span>'; return; }
                grid.innerHTML = items.map(function (it) {
                    var sel = (_igJournalRef && _igJournalRef.id === it.id) ? ' is-sel' : '';
                    return '<button type="button" class="st-jref-item' + sel + '" data-id="' + it.id + '" data-name="' + rd6Esc(it.name) + '" onclick="rd6IgPickRef(this)"><img src="' + it.url + '" alt=""></button>';
                }).join('');
            }).catch(function () { grid.innerHTML = '<span style="font-size:11px">erro</span>'; });
        }
        function rd6IgPickRef(btn) {
            var id = parseInt(btn.getAttribute('data-id'), 10);
            document.querySelectorAll('#ig-jref-grid .st-jref-item').forEach(function (b) { b.classList.remove('is-sel'); });
            if (_igJournalRef && _igJournalRef.id === id) { _igJournalRef = null; }
            else { _igJournalRef = { id: id, name: btn.getAttribute('data-name') }; btn.classList.add('is-sel'); }
            document.getElementById('ig-jref-label').textContent = _igJournalRef ? ('ref: ' + _igJournalRef.name) : '';
        }
        function rd6IgSubmit() {
            var prompt = (document.getElementById('ig-prompt').value || '').trim();
            var st = document.getElementById('ig-status');
            if (!prompt) { st.textContent = 'Descreva a imagem primeiro.'; return; }
            var refIn = document.getElementById('ig-ref');
            var refFile = refIn && refIn.files && refIn.files[0];
            st.textContent = 'Enviando…';
            var fd = new FormData();
            fd.append('prompt', prompt);
            fd.append('kind', document.getElementById('ig-kind').value);
            fd.append('style', document.getElementById('ig-style').value);
            fd.append('use_context', document.getElementById('ig-context').checked ? '1' : '0');
            fd.append('title', document.getElementById('ig-title').value || '');
            if (_igJournalRef) fd.append('ref_asset_id', _igJournalRef.id);
            if (refFile) fd.append('ref_image', refFile);
            fetch('/imagegen/' + RD6_IG_CAMP + '/request/', { method: 'POST', headers: { 'X-CSRFToken': rd6Csrf() }, body: fd })
                .then(function (r) { return r.json(); }).then(function (d) {
                    if (d && d.ok) {
                        document.getElementById('ig-prompt').value = '';
                        if (refIn) refIn.value = '';
                        _igJournalRef = null; document.getElementById('ig-jref-label').textContent = '';
                        st.textContent = d.comfy_online ? 'Gerando na GPU… pode levar de segundos a min.' : '⚠ ComfyUI offline — pedido na fila.';
                        rd6IgPollStart();
                    } else { st.textContent = (d && d.error) || 'Erro.'; }
                }).catch(function () { st.textContent = 'Falha de rede.'; });
        }
        function rd6IgPollStart() {
            fetch('/imagegen/' + RD6_IG_CAMP + '/list/').then(function (r) { return r.json(); }).then(function (d) {
                if (!d || !d.ok) return;
                rd6IgRender(d.requests || [], d.comfy || {});
                var active = (d.requests || []).some(function (x) { return x.status === 'pending' || x.status === 'processing'; });
                if (_igPoll) clearTimeout(_igPoll);
                if (active) _igPoll = setTimeout(rd6IgPollStart, 4000);
            }).catch(function () {});
        }
        function rd6IgRender(reqs, comfy) {
            var box = document.getElementById('ig-list');
            var head = (comfy && !comfy.online) ? '<div class="st-err">ComfyUI offline no host.</div>' : '';
            var S = { pending: 'na fila', processing: 'gerando', done: 'pronto', failed: 'falhou' };
            box.innerHTML = head + (reqs || []).map(function (r) {
                var h = '<div class="st-card"><span class="st-badge ' + r.status + '">' + (S[r.status] || r.status) + '</span> <span style="font-size:10px;opacity:.6">' + rd6Esc(r.kind) + '</span>';
                h += '<div class="st-prompt">' + rd6Esc(r.prompt) + '</div>';
                if (r.expanded_prompt && r.expanded_prompt !== r.prompt) h += '<details class="st-xprompt"><summary>prompt da IA</summary><div>' + rd6Esc(r.expanded_prompt) + '</div></details>';
                if (r.status === 'done' && r.has_result) {
                    h += '<img class="st-preview" src="/imagegen/png/' + r.id + '/" onclick="window.open(this.src)">';
                    h += '<div class="st-actions"><button class="st-approve" onclick="rd6IgApprove(' + r.id + ')">✓ Aprovar (vira asset)</button><button onclick="rd6IgDiscard(' + r.id + ')">✕ Descartar</button></div>';
                } else if (r.status === 'failed') {
                    h += '<div class="st-err">' + rd6Esc(r.error || 'falhou') + '</div><div class="st-actions"><button onclick="rd6IgDiscard(' + r.id + ')">Remover</button></div>';
                }
                return h + '</div>';
            }).join('');
        }
        function rd6IgApprove(id) {
            fetch('/imagegen/' + id + '/approve/', { method: 'POST', headers: { 'X-CSRFToken': rd6Csrf() } })
                .then(function (r) { return r.json(); }).then(function (d) {
                    document.getElementById('ig-status').textContent = (d && d.ok) ? ('✓ Aprovado — está no Journal (oculto dos players).') : ((d && d.error) || 'Erro.');
                    rd6IgPollStart();
                }).catch(function () {});
        }
        function rd6IgDiscard(id) {
            fetch('/imagegen/' + id + '/discard/', { method: 'POST', headers: { 'X-CSRFToken': rd6Csrf() } }).then(function () { rd6IgPollStart(); }).catch(function () {});
        }
        rd6IgPollStart();
    </script>
</body>

</html>
