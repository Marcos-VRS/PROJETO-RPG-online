{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'global/partials/_design_head.html' %}
    <link rel="stylesheet" href="{% static 'global/css/lista_campanhas_style.css' %}?d={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'global/css/fontes.css' %}?d={% now 'U' %}">
    <title>Estúdio de Imagem</title>
    <style>
        .st-wrap { max-width: 720px; margin: 0 auto; padding: 16px; color: #e8e8e8; }
        .st-wrap a.voltar { color: #c9a55c; font-size: 14px; }
        .st-field { display: block; margin: 10px 0; font-size: 14px; color: #c0c0cc; }
        .st-field select, .st-field input[type=text], .st-wrap textarea {
            width: 100%; background: #26262e; color: #e8e8e8; border: 1px solid #444;
            border-radius: 6px; padding: 8px; font-family: inherit; box-sizing: border-box; }
        .st-wrap textarea { resize: vertical; }
        .st-check { display: flex; align-items: center; gap: 6px; }
        .st-gen { width: 100%; background: #7a2ea0; color: #fff; border: none; border-radius: 6px;
            padding: 12px; cursor: pointer; font-size: 15px; font-weight: 700; margin-top: 8px; }
        .st-gen:hover { background: #9a3ec8; }
        .st-status { color: #c9a55c; font-size: 13px; min-height: 18px; margin: 8px 0; }
        .st-card { background: #24242c; border: 1px solid #383840; border-radius: 8px; padding: 10px; margin-top: 12px; }
        .st-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #444; }
        .st-badge.processing { background: #3a5a8a; } .st-badge.done { background: #2e7d46; }
        .st-badge.failed { background: #8a2e2e; }
        .st-prompt { font-size: 13px; margin: 6px 0; }
        .st-xprompt { font-size: 11px; color: #999; } .st-xprompt div { font-style: italic; margin-top: 3px; }
        .st-preview { width: 100%; border-radius: 6px; margin-top: 6px; cursor: zoom-in; }
        .st-actions { display: flex; gap: 6px; margin-top: 6px; }
        .st-actions button { flex: 1; padding: 8px; border: none; border-radius: 5px; cursor: pointer; background: #3a3a44; color: #eee; }
        .st-approve { background: #2e7d46 !important; }
        .st-err { color: #ff8a8a; font-size: 12px; }
        .st-jref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px,1fr)); gap: 6px;
            margin-top: 6px; max-height: 180px; overflow-y: auto; padding: 4px; border: 1px solid #444; border-radius: 6px; }
        .st-jref-grid[hidden] { display: none; }
        .st-jref-item { padding: 0; border: 2px solid transparent; border-radius: 5px; background: none; cursor: pointer; aspect-ratio: 1; overflow: hidden; }
        .st-jref-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .st-jref-item.is-sel { border-color: #c9a55c; }
        .ig-chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
        .ig-chip { display: inline-flex; align-items: center; gap: 6px; background: #30303a;
            border: 1px solid #4a4a55; border-radius: 14px; padding: 4px 6px 4px 10px; font-size: 12px; color: #e0e0e8; }
        .ig-chip b { cursor: pointer; color: #ff9a9a; font-weight: 700; padding: 0 4px; border-radius: 10px; line-height: 1; }
        .ig-chip b:hover { background: #5a2a2a; color: #fff; }
        .ig-addrow { display: flex; gap: 6px; margin: 6px 0; }
        .ig-addrow input { flex: 1; }
        .ig-addrow button { background: #3a5a8a; color: #fff; border: none; border-radius: 6px; padding: 0 12px; cursor: pointer; }
        .ig-deeprow { display: flex; gap: 6px; margin-top: 6px; }
        .ig-deeprow .st-regen { background: #7a2ea0; }
        .ig-deeprow .st-deepen { background: #2e6d7d; }
        .ig-deeprow button { flex: 1; color: #fff; border: none; border-radius: 6px; padding: 10px; cursor: pointer; font-weight: 700; }
    </style>
</head>

<body>
    <div class="st-wrap">
        <a class="voltar" href="{% url 'gurps:carregar_campanha_gm' %}">← voltar</a>
        <h1 class="titulo-pagina medievalsharp-regular" style="font-size:2rem;">🎨 Estúdio de Imagem — {{ campanha.nome }}</h1>
        <p style="margin:-6px 0 10px;"><a href="{% url 'gurps:editar_campanha' campanha.id %}" style="color:#9ab;font-size:13px;">⚙️ Configurações da campanha (descrição / regras / contexto)</a></p>

        <label class="st-field">Tipo:
            <select id="ig-kind" onchange="rd6IgKindChange()">
                <option value="personagem">Personagem (retrato)</option>
                <option value="cena">Cena / cenário</option>
                <option value="capa">Capa / título (com texto)</option>
                <option value="item">Item / objeto</option>
            </select>
        </label>
        <label class="st-field" id="ig-title-wrap" style="display:none;">Título do episódio (escrito por cima):
            <input type="text" id="ig-title" maxlength="200" placeholder="Ex.: Episódio 7: O Portão Sombrio">
        </label>
        <label class="st-field">Estilo:
            <select id="ig-style">
                <option value="cinematic_dark">Cinematográfico escuro (realista) — padrão</option>
                <option value="photoreal">Fotorrealista neutro</option>
                <option value="oil">Pintura a óleo sombria</option>
                <option value="gritty">Sujo / grimdark</option>
                <option value="anime">Anime</option>
                <option value="none">Sem estilo</option>
            </select>
        </label>
        <label class="st-field">Enquadramento:
            <select id="ig-framing">
                <option value="">IA decide (pelo que você escrever)</option>
                <option value="portrait">Retrato (rosto / busto)</option>
                <option value="fullbody">Corpo inteiro (cabeça aos pés)</option>
                <option value="action">Em ação / fazendo algo</option>
            </select>
        </label>
        <label class="st-field">Descreva (curto — a IA completa lendo o journal):
            <textarea id="ig-prompt" rows="3" placeholder="Ex.: 'o grupo diante do portão da cidade ao anoitecer'"></textarea>
        </label>
        <label class="st-field st-check"><input type="checkbox" id="ig-context" checked> Ler o journal (coerência com o mundo)</label>
        <label class="st-field st-check" title="Negativo mínimo + o Claude não suaviza: libera cicatrizes, olho cego, ferimentos, gore e nudez (personagens adultos). Sem travas de aparência."><input type="checkbox" id="ig-allowall"> 🔓 Permitir tudo (gore, cicatrizes, nudez — sem travas)</label>
        <label class="st-field st-check" title="Manda o seu texto EXATO pro gerador, sem o Claude reescrever/traduzir. Use pra ter controle total (ex.: enquadramento de corpo inteiro, nudez). Dica: escreva em inglês pra sair melhor."><input type="checkbox" id="ig-verbatim"> ✍️ Usar meu texto exato (sem o Claude reescrever)</label>
        <div class="st-field">
            <button type="button" class="menu-button" onclick="rd6IgToggleJournalRef()" style="font-size:12px;">📖 Referência do journal</button>
            <span id="ig-jref-label" style="font-size:11px;color:#999;margin-left:6px;"></span>
            <div id="ig-jref-grid" class="st-jref-grid" hidden></div>
        </div>
        <label class="st-field" style="font-size:12px;">…ou enviar uma referência:
            <input type="file" id="ig-ref" accept="image/*">
        </label>
        <label class="st-field" style="font-size:12px;" title="Quanto a foto de referência trava o rosto. ALTO = fiel à foto (mas NÃO deixa adicionar cicatriz/olho cego/mudar o rosto). BAIXO/zero = libera o prompt a mudar o rosto.">
            Força da referência: <b><span id="ig-rwv">35</span>%</b>
            <input type="range" id="ig-rw" min="0" max="120" value="35" step="5" oninput="document.getElementById('ig-rwv').textContent=this.value" style="width:100%;">
            <span style="font-size:10px;color:#e0a0a0;">⚠ A referência TRAVA o rosto. Pra pôr cicatriz, olho cego ou mudar o rosto, <b>tire a referência</b> (nem selecione, nem envie foto) — qualquer força acima de ~20% já impede a cicatriz.</span>
        </label>
        <button type="button" class="st-gen" onclick="rd6IgSubmit()">Gerar imagem</button>
        <p class="st-status" id="ig-status"></p>
        <div id="ig-list"></div>
    </div>

    {% csrf_token %}
    <script>
        var RD6_IG_CAMP = {{ campanha.id }};
        var _igPoll = null, _igJournalRef = null, _igBullets = {};
        function rd6Csrf() { var e = document.querySelector('[name=csrfmiddlewaretoken]'); return e ? e.value : ''; }
        // Divide um prompt SDXL em "partes" nas vírgulas de TOPO (ignora vírgulas
        // dentro de parênteses, ex.: "(a, b:1.3)" continua uma parte só).
        function rd6SplitClauses(s) {
            var out = [], depth = 0, cur = '';
            s = (s || '').toString();
            for (var i = 0; i < s.length; i++) {
                var c = s[i];
                if (c === '(') depth++;
                else if (c === ')') depth = Math.max(0, depth - 1);
                if (c === ',' && depth === 0) { if (cur.trim()) out.push(cur.trim()); cur = ''; }
                else cur += c;
            }
            if (cur.trim()) out.push(cur.trim());
            return out;
        }
        function rd6IgRenderChips(id) {
            var box = document.getElementById('ig-chips-' + id);
            if (!box) return;
            var arr = _igBullets[id] || [];
            box.innerHTML = arr.map(function (t, i) {
                return '<span class="ig-chip">' + rd6Esc(t) + '<b title="remover" onclick="rd6IgDelChip(' + id + ',' + i + ')">✕</b></span>';
            }).join('') || '<span style="font-size:11px;color:#777;">(sem partes — adicione abaixo)</span>';
        }
        function rd6IgAddChip(id) {
            var inp = document.getElementById('ig-addc-' + id);
            if (!inp) return;
            var v = (inp.value || '').trim();
            if (!v) return;
            if (_igBullets[id] === undefined) _igBullets[id] = [];
            // aceita vários de uma vez separados por vírgula
            rd6SplitClauses(v).forEach(function (p) { _igBullets[id].push(p); });
            inp.value = '';
            rd6IgRenderChips(id);
        }
        function rd6IgDelChip(id, i) {
            if (!_igBullets[id]) return;
            _igBullets[id].splice(i, 1);
            rd6IgRenderChips(id);
        }
        function rd6Esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
        function rd6IgKindChange() {
            document.getElementById('ig-title-wrap').style.display =
                (document.getElementById('ig-kind').value === 'capa') ? 'block' : 'none';
        }
        function rd6IgToggleJournalRef() {
            var grid = document.getElementById('ig-jref-grid');
            if (!grid.hidden) { grid.hidden = true; return; }
            grid.hidden = false; grid.innerHTML = '<span style="font-size:11px;opacity:.6">carregando…</span>';
            fetch('/imagegen/' + RD6_IG_CAMP + '/journal/').then(function (r) { return r.json(); }).then(function (d) {
                var items = (d && d.items) || [];
                if (!items.length) { grid.innerHTML = '<span style="font-size:11px;opacity:.6">Nenhuma imagem no journal.</span>'; return; }
                grid.innerHTML = items.map(function (it) {
                    var sel = (_igJournalRef && _igJournalRef.id === it.id) ? ' is-sel' : '';
                    return '<button type="button" class="st-jref-item' + sel + '" data-id="' + it.id + '" data-name="' + rd6Esc(it.name) + '" onclick="rd6IgPickRef(this)"><img src="' + it.url + '" alt=""></button>';
                }).join('');
            }).catch(function () { grid.innerHTML = '<span style="font-size:11px">erro</span>'; });
        }
        function rd6IgPickRef(btn) {
            var id = parseInt(btn.getAttribute('data-id'), 10);
            document.querySelectorAll('#ig-jref-grid .st-jref-item').forEach(function (b) { b.classList.remove('is-sel'); });
            if (_igJournalRef && _igJournalRef.id === id) { _igJournalRef = null; }
            else { _igJournalRef = { id: id, name: btn.getAttribute('data-name') }; btn.classList.add('is-sel'); }
            document.getElementById('ig-jref-label').textContent = _igJournalRef ? ('ref: ' + _igJournalRef.name) : '';
        }
        function rd6IgSubmit() {
            var prompt = (document.getElementById('ig-prompt').value || '').trim();
            var st = document.getElementById('ig-status');
            if (!prompt) { st.textContent = 'Descreva a imagem primeiro.'; return; }
            var refIn = document.getElementById('ig-ref');
            var refFile = refIn && refIn.files && refIn.files[0];
            st.textContent = 'Enviando…';
            var fd = new FormData();
            fd.append('prompt', prompt);
            fd.append('kind', document.getElementById('ig-kind').value);
            fd.append('style', document.getElementById('ig-style').value);
            fd.append('use_context', document.getElementById('ig-context').checked ? '1' : '0');
            fd.append('allow_all', document.getElementById('ig-allowall').checked ? '1' : '0');
            fd.append('verbatim', document.getElementById('ig-verbatim').checked ? '1' : '0');
            fd.append('framing', document.getElementById('ig-framing').value || '');
            fd.append('ref_weight', (parseInt(document.getElementById('ig-rw').value, 10) / 100).toString());
            fd.append('title', document.getElementById('ig-title').value || '');
            if (_igJournalRef) fd.append('ref_asset_id', _igJournalRef.id);
            if (refFile) fd.append('ref_image', refFile);
            fetch('/imagegen/' + RD6_IG_CAMP + '/request/', { method: 'POST', headers: { 'X-CSRFToken': rd6Csrf() }, body: fd })
                .then(function (r) { return r.json(); }).then(function (d) {
                    if (d && d.ok) {
                        document.getElementById('ig-prompt').value = '';
                        if (refIn) refIn.value = '';
                        _igJournalRef = null; document.getElementById('ig-jref-label').textContent = '';
                        st.textContent = d.comfy_online ? 'Gerando na GPU… pode levar de segundos a min.' : '⚠ ComfyUI offline — pedido na fila.';
                        rd6IgPollStart();
                    } else { st.textContent = (d && d.error) || 'Erro.'; }
                }).catch(function () { st.textContent = 'Falha de rede.'; });
        }
        function rd6IgPollStart() {
            fetch('/imagegen/' + RD6_IG_CAMP + '/list/').then(function (r) { return r.json(); }).then(function (d) {
                if (!d || !d.ok) return;
                rd6IgRender(d.requests || [], d.comfy || {});
                var active = (d.requests || []).some(function (x) { return x.status === 'pending' || x.status === 'processing'; });
                if (_igPoll) clearTimeout(_igPoll);
                if (active) _igPoll = setTimeout(rd6IgPollStart, 4000);
            }).catch(function () {});
        }
        function rd6IgRender(reqs, comfy) {
            var box = document.getElementById('ig-list');
            // Se o GM está digitando/mexendo num campo da lista, NÃO reconstrói agora
            // (senão o cursor perde o foco, "como se desse TAB pra fora"). Re-renderiza
            // no próximo poll, quando ele sair do campo.
            var ae = document.activeElement;
            if (ae && box.contains(ae) && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT' || ae.tagName === 'SELECT')) {
                return;
            }
            // preserva os editores abertos (e o que o GM já digitou) entre os polls
            var saved = {};
            box.querySelectorAll('.st-edit').forEach(function (el) {
                if (el.hidden) return;
                var id = el.id.replace('ig-edit-', '');
                var g = function (x) { return document.getElementById(x + id); };
                saved[id] = {
                    allow: g('ig-ea-') ? g('ig-ea-').checked : null,
                    ns: g('ig-ns-') ? g('ig-ns-').checked : null,
                    rw: g('ig-erw-') ? g('ig-erw-').value : null,
                    noref: g('ig-nr-') ? g('ig-nr-').checked : null,
                    fr: g('ig-ef-') ? g('ig-ef-').value : null,
                    ds: g('ig-ds-') ? g('ig-ds-').value : null
                };
            });
            var head = (comfy && !comfy.online) ? '<div class="st-err">ComfyUI offline no host.</div>' : '';
            var S = { pending: 'na fila', processing: 'gerando', done: 'pronto', failed: 'falhou' };
            box.innerHTML = head + (reqs || []).map(function (r) {
                var h = '<div class="st-card"><span class="st-badge ' + r.status + '">' + (S[r.status] || r.status) + '</span> <span style="font-size:10px;opacity:.6">' + rd6Esc(r.kind) + '</span>';
                h += '<div class="st-prompt">' + rd6Esc(r.prompt) + '</div>';
                if (r.expanded_prompt && r.expanded_prompt !== r.prompt) h += '<details class="st-xprompt"><summary>prompt da IA</summary><div>' + rd6Esc(r.expanded_prompt) + '</div></details>';
                if (r.status === 'done' && r.has_result) {
                    h += '<img class="st-preview" src="/imagegen/png/' + r.id + '/" onclick="window.open(this.src)">';
                    h += '<div class="st-actions"><button class="st-approve" onclick="rd6IgApprove(' + r.id + ')">✓ Aprovar (vira asset)</button><button onclick="rd6IgEdit(' + r.id + ')">✏️ Editar prompt e regerar</button><button onclick="rd6IgDiscard(' + r.id + ')">✕ Descartar</button></div>';
                    // editor inline (começa oculto): bullets editáveis + regerar/aprofundar
                    var pretext = (r.expanded_prompt && r.expanded_prompt.length) ? r.expanded_prompt : r.prompt;
                    if (_igBullets[r.id] === undefined) _igBullets[r.id] = rd6SplitClauses(pretext);
                    var rwpct = Math.round((r.ref_weight != null ? r.ref_weight : 0.7) * 100);
                    h += '<div class="st-edit" id="ig-edit-' + r.id + '" hidden style="margin-top:8px;">'
                      + '<div style="font-size:11px;color:#999;margin-bottom:2px;">Partes do pedido — remova (✕) o que não quer, ou adicione novas:</div>'
                      + '<div class="ig-chips" id="ig-chips-' + r.id + '"></div>'
                      + '<div class="ig-addrow"><input type="text" id="ig-addc-' + r.id + '" placeholder="adicionar parte: ex. chuva, sangue escorrendo..." onkeydown="if(event.key===\'Enter\'){rd6IgAddChip(' + r.id + ');event.preventDefault();}"><button type="button" onclick="rd6IgAddChip(' + r.id + ')">➕ Adicionar</button></div>'
                      + '<label style="font-size:12px;display:block;margin:4px 0;">Enquadramento: '
                      + '<select id="ig-ef-' + r.id + '">'
                      + ['', 'portrait', 'fullbody', 'action'].map(function (v) {
                            var lbl = { '': 'IA decide', 'portrait': 'Retrato', 'fullbody': 'Corpo inteiro', 'action': 'Em ação' }[v];
                            return '<option value="' + v + '"' + ((r.framing || '') === v ? ' selected' : '') + '>' + lbl + '</option>';
                        }).join('')
                      + '</select></label>'
                      + '<label class="st-check" style="font-size:12px;display:block;margin:4px 0;"><input type="checkbox" id="ig-ea-' + r.id + '"' + (r.allow_all ? ' checked' : '') + '> 🔓 Permitir tudo (gore, cicatrizes)</label>';
                    if (r.has_ref) {
                        h += '<label class="st-check" style="font-size:12px;display:block;margin:4px 0;"><input type="checkbox" id="ig-nr-' + r.id + '"> 🚫 Ignorar a foto de referência (gera só pelo texto)</label>'
                          + '<label style="font-size:12px;display:block;margin:4px 0;">Força da referência: <b><span id="ig-erwv-' + r.id + '">' + rwpct + '</span>%</b>'
                          + '<input type="range" id="ig-erw-' + r.id + '" min="0" max="120" value="' + rwpct + '" step="5" oninput="var e=document.getElementById(\'ig-erwv-' + r.id + '\');if(e)e.textContent=this.value;" style="width:100%;">'
                          + '<span style="font-size:10px;color:#999;">Baixe pra ~30-40% pra a cicatriz/olho cego entrar.</span></label>';
                    }
                    h += '<label class="st-check" style="font-size:12px;display:block;margin:4px 0;"><input type="checkbox" id="ig-ns-' + r.id + '"> 🎲 Nova seed (senão repete a mesma pra comparar)</label>'
                      + '<label style="font-size:12px;display:block;margin:6px 0 2px;">Intensidade do Aprofundar: <b><span id="ig-dsv-' + r.id + '">35</span>%</b> <span style="color:#999;font-size:10px;">(suave = só detalhe · forte = muda mais)</span></label>'
                      + '<input type="range" id="ig-ds-' + r.id + '" min="20" max="75" value="35" step="5" oninput="var e=document.getElementById(\'ig-dsv-' + r.id + '\');if(e)e.textContent=this.value;" style="width:100%;">'
                      + '<div class="ig-deeprow">'
                      + '<button type="button" class="st-regen" onclick="rd6IgRegen(' + r.id + ')">🔁 Regerar do zero</button>'
                      + '<button type="button" class="st-deepen" onclick="rd6IgDeepen(' + r.id + ')">⏫ Aprofundar esta</button>'
                      + '</div>'
                      + '<p style="font-size:11px;color:#999;margin:4px 0 0;">🔁 recria a imagem do zero com estas partes. ⏫ parte DESTA imagem e aprofunda o detalhe (mantém a composição).</p>'
                      + '</div>';
                } else if (r.status === 'failed') {
                    h += '<div class="st-err">' + rd6Esc(r.error || 'falhou') + '</div><div class="st-actions"><button onclick="rd6IgDiscard(' + r.id + ')">Remover</button></div>';
                }
                return h + '</div>';
            }).join('');
            // desenha os chips (partes) de cada card pronto
            (reqs || []).forEach(function (r) {
                if (r.status === 'done' && r.has_result) rd6IgRenderChips(r.id);
            });
            // restaura os editores que estavam abertos
            Object.keys(saved).forEach(function (id) {
                var el = document.getElementById('ig-edit-' + id);
                if (!el) return;
                el.hidden = false;
                var s = saved[id];
                var g = function (x) { return document.getElementById(x + id); };
                if (s.allow != null && g('ig-ea-')) g('ig-ea-').checked = s.allow;
                if (s.ns != null && g('ig-ns-')) g('ig-ns-').checked = s.ns;
                if (s.rw != null && g('ig-erw-')) { g('ig-erw-').value = s.rw; var v = g('ig-erwv-'); if (v) v.textContent = s.rw; }
                if (s.noref != null && g('ig-nr-')) g('ig-nr-').checked = s.noref;
                if (s.fr != null && g('ig-ef-')) g('ig-ef-').value = s.fr;
                if (s.ds != null && g('ig-ds-')) { g('ig-ds-').value = s.ds; var dv = g('ig-dsv-'); if (dv) dv.textContent = s.ds; }
            });
        }
        function rd6IgApprove(id) {
            fetch('/imagegen/' + id + '/approve/', { method: 'POST', headers: { 'X-CSRFToken': rd6Csrf() } })
                .then(function (r) { return r.json(); }).then(function (d) {
                    document.getElementById('ig-status').textContent = (d && d.ok) ? ('✓ Aprovado — está no Journal (oculto dos players).') : ((d && d.error) || 'Erro.');
                    rd6IgPollStart();
                }).catch(function () {});
        }
        function rd6IgDiscard(id) {
            fetch('/imagegen/' + id + '/discard/', { method: 'POST', headers: { 'X-CSRFToken': rd6Csrf() } }).then(function () { rd6IgPollStart(); }).catch(function () {});
        }
        function rd6IgEdit(id) {
            var el = document.getElementById('ig-edit-' + id);
            if (el) el.hidden = !el.hidden;
        }
        function rd6IgPromptFromBullets(id) {
            var arr = _igBullets[id] || [];
            // inclui o que estiver digitado no campo de adicionar, mesmo sem clicar ➕
            var inp = document.getElementById('ig-addc-' + id);
            var pending = inp && inp.value.trim() ? rd6SplitClauses(inp.value) : [];
            return arr.concat(pending).join(', ').trim();
        }
        function rd6IgRegen(id) {
            var prompt = rd6IgPromptFromBullets(id);
            if (!prompt) { document.getElementById('ig-status').textContent = 'Sem partes no pedido — adicione pelo menos uma.'; return; }
            var allow = document.getElementById('ig-ea-' + id);
            var ns = document.getElementById('ig-ns-' + id);
            var rw = document.getElementById('ig-erw-' + id);
            var nr = document.getElementById('ig-nr-' + id);
            var fr = document.getElementById('ig-ef-' + id);
            var payload = { prompt: prompt, allow_all: allow && allow.checked ? 1 : 0, new_seed: ns && ns.checked ? 1 : 0 };
            if (fr) payload.framing = fr.value || '';
            if (rw) payload.ref_weight = (parseInt(rw.value, 10) / 100);
            if (nr && nr.checked) payload.drop_ref = 1;
            document.getElementById('ig-status').textContent = 'Regerando…';
            fetch('/imagegen/' + id + '/regenerate/', {
                method: 'POST',
                headers: { 'X-CSRFToken': rd6Csrf(), 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(function (r) { return r.json(); }).then(function (d) {
                document.getElementById('ig-status').textContent = (d && d.ok)
                    ? (d.comfy_online ? 'Regerando na GPU…' : '⚠ ComfyUI offline — pedido na fila.')
                    : ((d && d.error) || 'Erro.');
                if (d && d.ok) rd6IgPollStart();
            }).catch(function () { document.getElementById('ig-status').textContent = 'Falha de rede.'; });
        }
        function rd6IgDeepen(id) {
            var prompt = rd6IgPromptFromBullets(id);
            if (!prompt) { document.getElementById('ig-status').textContent = 'Sem partes no pedido — adicione pelo menos uma.'; return; }
            var allow = document.getElementById('ig-ea-' + id);
            var ds = document.getElementById('ig-ds-' + id);
            var strength = ds ? (parseInt(ds.value, 10) / 100) : 0.35;
            var payload = { prompt: prompt, allow_all: allow && allow.checked ? 1 : 0, strength: strength };
            document.getElementById('ig-status').textContent = 'Aprofundando (img2img, pode levar ~1 min)…';
            fetch('/imagegen/' + id + '/deepen/', {
                method: 'POST',
                headers: { 'X-CSRFToken': rd6Csrf(), 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(function (r) { return r.json(); }).then(function (d) {
                document.getElementById('ig-status').textContent = (d && d.ok)
                    ? (d.comfy_online ? 'Aprofundando na GPU…' : '⚠ ComfyUI offline — pedido na fila.')
                    : ((d && d.error) || 'Erro.');
                if (d && d.ok) rd6IgPollStart();
            }).catch(function () { document.getElementById('ig-status').textContent = 'Falha de rede.'; });
        }
        rd6IgPollStart();
    </script>
