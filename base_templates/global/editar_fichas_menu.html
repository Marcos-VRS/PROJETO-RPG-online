{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'global/partials/_design_head.html' %}
    <link rel="stylesheet" href="{% static 'global/css/lista_campanhas_style.css' %}?d={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'global/css/fontes.css' %}?d={% now 'U' %}">
    <title>EDITAR FICHAS PLAYER</title>
</head>

<body>
    <h1 style="font-size: 3rem;" class="titulo-pagina medievalsharp-regular">FICHAS PLAYER</h1>

    <a class="item-lista medievalsharp-regular" style="font-size: 1rem;" href="{% url 'gurps:criar_v2' campanha_id=campanha_id %}">
        <h1>CRIAR NOVA FICHA</h1>
    </a>

    <a class="item-lista medievalsharp-regular" style="font-size: 1rem;" href="{% url 'gurps:lista_v2_player' campanha_id=campanha_id %}">
        <h1>EDITAR FICHA</h1>
    </a>

    <details style="margin-top: 30px; opacity: 0.6;">
        <summary class="medievalsharp-regular" style="text-align:center; cursor: pointer; color: var(--rd6-text-dim); padding: 10px;">Ficha Legado (acesso pra migração)</summary>

        <a class="item-lista medievalsharp-regular" style="font-size: 0.9rem;" href="{% url "gurps:criar_ficha_campanha" campanha_id %}">
            <h1>CRIAR FICHA (LEGADO)</h1>
        </a>

        <a class="item-lista medievalsharp-regular" style="font-size: 0.9rem;" href="{% url "gurps:lista_gm_fichas" campanha_id %}">
            <h1>EDITAR FICHA (LEGADO)</h1>
        </a>

        <a class="item-lista medievalsharp-regular" style="font-size: 0.9rem;" href="{% url "gurps:delete_sheet_menu_player" campanha_id %}">
            <h1>REMOVER FICHA (LEGADO)</h1>
        </a>
    </details>
</body>

</html>
