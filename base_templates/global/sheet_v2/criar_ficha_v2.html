{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'global/partials/_design_head.html' %}
    <title>Nova Ficha — {{ campanha.nome }}</title>
    <style>
        body { font-family: var(--rd6-font-body); color: var(--rd6-text); background: var(--rd6-bg); padding: 40px; }
        .wrap { max-width: 600px; margin: 0 auto; }
        h1 { font-family: var(--rd6-font-display); color: var(--rd6-accent); }
        form { background: var(--rd6-bg-elevated); padding: 24px; border: 1px solid var(--rd6-border); border-radius: var(--rd6-radius-md); }
        label { display: block; margin: 12px 0 4px; font-weight: 600; }
        input[type=text] { width: 100%; padding: 8px; background: var(--rd6-bg); color: var(--rd6-text); border: 1px solid var(--rd6-border); border-radius: var(--rd6-radius-sm); }
        button { background: var(--rd6-accent); color: var(--rd6-bg); padding: 10px 20px; border: none; border-radius: var(--rd6-radius-sm); cursor: pointer; margin-top: 16px; font-weight: 600; }
        .err { color: var(--rd6-hp); margin-top: 8px; }
        .back { color: var(--rd6-text-dim); text-decoration: none; }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="{% url 'gurps:lista_v2_player' campanha_id=campanha.id %}" class="back">← Voltar</a>
        <h1>Nova Ficha (V2)</h1>
        <p>Campanha: <strong>{{ campanha.nome }}</strong></p>

        <form method="post">
            {% csrf_token %}
            <label for="nome_personagem">Nome do personagem</label>
            <input type="text" id="nome_personagem" name="nome_personagem" maxlength="60" required autofocus>

            {% if error %}<div class="err">{{ error }}</div>{% endif %}

            <button type="submit">Criar e prosseguir para edição</button>
        </form>
    </div>
</body>
</html>
